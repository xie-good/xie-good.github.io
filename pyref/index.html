<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyRef · Python Syntax Quick Reference</title>
<style>
  :root{
    --bg:#f6f8fa; --panel:#ffffff; --text:#1f2328; --muted:#57606a;
    --border:#d8dee4; --accent:#3776ab; --accent2:#ffd43b;
    --code-bg:#f0f2f5; --code-border:#dfe3e8;
    --kw:#1a73e8; --kw-bg:#e8f0fe; --bi:#137333; --bi-bg:#e6f4ea;
    --mo:#b06000; --mo-bg:#fef7e0; --sy:#7627bb; --sy-bg:#f3e8fd;
    --note-bg:#fff8e1; --note-border:#f0d264;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.6;}
  code,pre,.mono{font-family:Consolas,"JetBrains Mono",Menlo,monospace;}

  header{position:sticky; top:0; z-index:10; background:var(--panel); border-bottom:1px solid var(--border); padding:14px 16px 10px;}
  .wrap{max-width:920px; margin:0 auto;}
  .logo{font-size:20px; font-weight:700; display:flex; align-items:center; gap:8px;}
  .logo .py{width:22px; height:22px; border-radius:50%; background:linear-gradient(135deg,#3776ab 50%,#ffd43b 50%); display:inline-block;}
  .logo small{font-weight:400; color:var(--muted); font-size:13px;}
  .searchbox{margin-top:10px; display:flex; gap:8px; align-items:center; background:var(--bg); border:1.5px solid var(--border); border-radius:10px; padding:10px 14px;}
  .searchbox:focus-within{border-color:var(--accent);}
  .searchbox input{flex:1; border:none; outline:none; background:transparent; font-size:17px; color:var(--text);}
  .searchbox kbd{background:#fff; border:1px solid var(--border); border-radius:5px; padding:1px 7px; font-size:12px; color:var(--muted);}
  .stats{margin-top:8px; font-size:12.5px; color:var(--muted);}
  .chips{margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;}
  .chip{font-size:12.5px; background:var(--panel); border:1px solid var(--border); border-radius:999px; padding:2px 12px; cursor:pointer; color:var(--text);}
  .chip:hover{border-color:var(--accent); color:var(--accent);}

  main{max-width:920px; margin:18px auto 60px; padding:0 16px;}
  .cat-head{display:flex; align-items:center; gap:8px; margin:22px 0 8px;}
  .cat-head h2{font-size:16px;}
  .cat-head .cnt{font-size:12px; color:var(--muted); background:var(--bg); border-radius:999px; padding:0 8px;}
  .row{display:flex; align-items:baseline; gap:10px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:8px 14px; margin-bottom:6px; cursor:pointer;}
  .row:hover{border-color:var(--accent);}
  .row.sel{border-color:var(--accent); box-shadow:0 0 0 2px rgba(55,118,171,.18);}
  .row .nm{font-family:Consolas,Menlo,monospace; font-weight:700; font-size:14.5px; white-space:nowrap;}
  .row .ds{color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .badge{display:inline-block; font-size:11.5px; border-radius:5px; padding:0 7px; line-height:20px; vertical-align:middle; white-space:nowrap;}
  .badge.keyword{color:var(--kw); background:var(--kw-bg);}
  .badge.builtin{color:var(--bi); background:var(--bi-bg);}
  .badge.module{color:var(--mo); background:var(--mo-bg);}
  .badge.syntax{color:var(--sy); background:var(--sy-bg);}
  .vbadge{font-size:11px; color:#c25000; background:#fdf0e3; border-radius:5px; padding:0 6px; line-height:18px; white-space:nowrap;}

  .detail{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:22px 26px;}
  .back{display:inline-block; cursor:pointer; color:var(--accent); font-size:13.5px; margin-bottom:12px; user-select:none;}
  .back:hover{text-decoration:underline;}
  .d-title{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .d-title h1{font-family:Consolas,Menlo,monospace; font-size:26px;}
  .d-desc{color:var(--muted); margin-top:4px;}
  .sect{margin-top:18px;}
  .sect h3{font-size:14px; color:var(--accent); margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .sect h3::before{content:""; width:4px; height:14px; background:var(--accent); border-radius:2px; display:inline-block;}
  pre{background:var(--code-bg); border:1px solid var(--code-border); border-radius:8px; padding:12px 14px; overflow-x:auto; font-size:13.5px; line-height:1.55; position:relative;}
  .cblock{position:relative; margin-bottom:14px;}
  .cblock .ct{font-size:12.5px; color:var(--muted); margin-bottom:4px;}
  .cbtn{position:absolute; top:28px; right:8px; font-size:11.5px; background:#fff; border:1px solid var(--border); border-radius:6px; padding:2px 10px; cursor:pointer; color:var(--muted);}
  .cbtn:hover{color:var(--accent); border-color:var(--accent);}
  table.apis{width:100%; border-collapse:collapse; font-size:13px;}
  table.apis th{background:var(--bg); text-align:left; padding:7px 10px; border:1px solid var(--border); font-size:12.5px;}
  table.apis td{padding:6px 10px; border:1px solid var(--border); vertical-align:top;}
  table.apis td:first-child{font-family:Consolas,Menlo,monospace; white-space:nowrap; font-weight:600;}
  .note{background:var(--note-bg); border:1px solid var(--note-border); border-radius:8px; padding:10px 14px; font-size:13.5px; white-space:pre-line;}
  .doclink{display:inline-block; margin-top:4px; color:var(--accent); font-size:13.5px; text-decoration:none;}
  .doclink:hover{text-decoration:underline;}
  .empty{text-align:center; color:var(--muted); padding:60px 0; font-size:14px;}
  footer{max-width:920px; margin:0 auto 40px; padding:0 16px; color:var(--muted); font-size:12.5px; border-top:1px solid var(--border); padding-top:14px;}
  @media (max-width:600px){
    .detail{padding:16px;}
    .row .nm{font-size:13.5px;}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="logo"><span class="py"></span>PyRef <small>Python Syntax Quick Reference · 关键字 / 内置函数 / 标准库 / 语法糖速查</small></div>

      <input id="q" type="text" placeholder="输入名称搜索，如 operator、yield、f-string、推导式…" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>

    <div class="stats" id="stats"></div>
    <div class="chips" id="chips"></div>

</header>
<main>
  <div id="list-view"></div>

</footer>

<script>
/* ===================== 数据区：想加条目就在对应数组里照格式加 ===================== */
const DATA = {
keyword: [
{n:"def", d:"定义函数（含各类参数写法）", syn:"def 函数名(位置参数, 默认参数=值, *args, 关键字仅限参数, **kwargs):",
ex:[{t:"参数种类一次看全", c:`def demo(a, b=1, *args, c, **kwargs):
    print(a, b, args, c, kwargs)

demo(1, 2, 3, 4, c=5, x=6, y=7)
# 1 2 (3, 4) 5 {'x': 6, 'y': 7}`},
{t:"返回多个值 = 返回元组", c:`def min_max(nums):
    return min(nums), max(nums)   # 打包成元组

lo, hi = min_max([3, 1, 4, 1, 5])
print(lo, hi)   # 1 5`}],
note:"⚠️ 默认参数别用可变对象：def f(x, lst=[]) 的 lst 会在多次调用间共享。用 lst=None 然后 lst = lst or []。",
doc:"https://docs.python.org/zh-cn/3/tutorial/controlflow.html#defining-functions", tags:["函数","参数","args","kwargs"]},
{n:"lambda", d:"匿名函数（单表达式）", syn:"lambda 参数: 表达式",
ex:[{t:"常用作排序 key", c:`users = [("张三", 25), ("李四", 19), ("王五", 31)]
by_age = sorted(users, key=lambda u: u[1])
print(by_age)   # [('李四', 19), ('张三', 25), ('王五', 31)]`}],
note:"只能是单个表达式，不能写语句。复杂逻辑请用 def。与 operator.itemgetter 搭配可更简洁：key=operator.itemgetter(1)。",
doc:"https://docs.python.org/zh-cn/3/reference/expressions.html#lambda", tags:["匿名函数","函数"]},
{n:"class", d:"定义类", syn:"class 类名(父类):\n    def __init__(self, 参数): ...",
ex:[{t:"一个够用的完整模板", c:`class Animal:
    def __init__(self, name):
        self.name = name
    def speak(self):
        return f"{self.name} 在叫"

class Dog(Animal):                      # 继承
    def __init__(self, name, breed):
        super().__init__(name)          # 调父类构造
        self.breed = breed
    def speak(self):                    # 方法重写
        return f"{self.name} 汪汪"
    @classmethod
    def create(cls, name):              # 工厂方法
        return cls(name, "田园犬")
    @property
    def info(self):                     # 属性化调用（不加括号）
        return f"{self.breed}-{self.name}"

d = Dog.create("旺财")
print(d.speak())   # 旺财 汪汪
print(d.info)      # 田园犬-旺财（注意没有括号）`}],
note:"简单数据类用 @dataclass 更省事（另查 dataclasses）。__repr__ 控制打印样式；__eq__ 控制 == 行为。",
doc:"https://docs.python.org/zh-cn/3/tutorial/classes.html", tags:["类","对象","面向对象","oop","继承"]},
{n:"import / from", d:"导入模块或成员", syn:"import 包.模块 as 别名\nfrom 模块 import 名字1, 名字2 as 别名",
ex:[{t:"四种常用姿势", c:`import os                        # 用 os.getcwd()
import numpy as np               # 起别名
from pathlib import Path         # 直接用 Path
from datetime import datetime, timedelta   # 导入多个`},
{t:"相对导入（包内部）", c:`from . import utils      # 同级模块
from ..models import User  # 上一层`}],
note:"import 会执行目标模块的顶层代码（所以入口逻辑要放在 if __name__ == '__main__': 里）。循环导入会报错，需拆模块。",
doc:"https://docs.python.org/zh-cn/3/reference/simple_stmts.html#the-import-statement", tags:["导入","模块","from"]},
{n:"if / elif / else", d:"条件分支", syn:"if 条件:\n    ...\nelif 条件2:\n    ...\nelse:\n    ...",
ex:[{t:"基础", c:`score = 85
if score >= 90:
    level = "A"
elif score >= 80:
    level = "B"   # 命中这里
else:
    level = "C"
print(level)   # B`}],
note:"三元表达式（另查「三元表达式」）适合简单赋值分支。条件判断真值规则见 bool()。",
doc:"https://docs.python.org/zh-cn/3/tutorial/controlflow.html#if-statements", tags:["条件","分支"]},
{n:"for", d:"遍历可迭代对象（含 for-else 技巧）", syn:"for 变量 in 可迭代对象:\n    ...\nelse:            # 没被 break 打断时才执行\n    ...",
ex:[{t:"遍历 + enumerate 拿下标", c:`fruits = ["苹果", "香蕉", "橙子"]
for i, fruit in enumerate(fruits, start=1):
    print(i, fruit)`},
{t:"for-else：找东西没找到的场景", c:`for u in users:
    if u["name"] == "张三":
        print("找到了"); break
else:
    print("遍历完都没找到")   # break 才能跳过 else`}],
note:"不要 range(len(list)) 再取下标，直接 enumerate。倒序遍历用 reversed()。空可迭代对象也允许。",
doc:"https://docs.python.org/zh-cn/3/reference/compound_stmts.html#the-for-statement", tags:["循环","遍历","foreach"]},
{n:"while", d:"条件循环", syn:"while 条件:\n    ...\n    break / continue",
ex:[{t:"while True + break（轮询/主循环模式）", c:`import time
while True:
    msg = get_task()
    if msg is None:
        break
    handle(msg)
    time.sleep(1)`}],
note:"小心写成死循环：确保循环体内有改变条件的语句。while 也能接 else（同 for-else）。",
doc:"https://docs.python.org/zh-cn/3/reference/compound_stmts.html#the-while-statement", tags:["循环"]},
{n:"try / except / else / finally", d:"异常处理完整结构", syn:"try:\n    可能出错的代码\nexcept (类型1, 类型2) as e:\n    处理\nelse:\n    没出错才执行\nfinally:\n    无论如何都执行",
ex:[{t:"完整结构", c:`def parse(text):
    try:
        n = int(text)
    except ValueError as e:
        print("不是数字:", e)
        return None
    else:
        return n * 2      # 没异常才走这里
    finally:
        print("处理完毕")  # 永远执行

parse("abc")   # 不是数字: invalid literal for int()...
parse("21")    # 处理完毕 → 返回 42`}],
note:"只捕获预计到的异常类型，别裸 except:（会连 Ctrl+C 都吞掉）。记录完整堆栈用 logger.exception()（另查 logging）。",
doc:"https://docs.python.org/zh-cn/3/tutorial/errors.html", tags:["异常","报错","try","except","finally"]},
{n:"raise", d:"抛出异常", syn:"raise 异常类型(\"消息\")\nraise                    # 在 except 里重新抛出\nraise 新异常 from 原异常",
ex:[{t:"抛出 + 自定义异常", c:`class BizError(Exception):
    \"\"\"业务异常\"\"\"

def withdraw(balance, amount):
    if amount > balance:
        raise BizError(f"余额不足: {balance} < {amount}")
    return balance - amount

try:
    withdraw(100, 200)
except BizError as e:
    print(e)   # 余额不足: 100 < 200`}],
note:"在 except 块里写裸 raise 可以保留原始堆栈继续往上抛。raise A from B 能保留异常链。",
doc:"https://docs.python.org/zh-cn/3/tutorial/errors.html#raising-exceptions", tags:["异常","抛错"]},
{n:"with", d:"上下文管理器（自动收尾）", syn:"with 表达式 as 变量:\n    ...",
ex:[{t:"文件自动关闭", c:`with open("data.txt", encoding="utf-8") as f:
    text = f.read()
# 出了 with 块自动 f.close()，即使中途抛异常也关

# 多个上下文一起写
with open("a.txt") as fa, open("b.txt") as fb:
    pass`}],
note:"凡是「用完必须收尾」的东西都优先找 with 版本：文件、锁、数据库连接。自造上下文管理器看 contextlib。",
doc:"https://docs.python.org/zh-cn/3/reference/compound_stmts.html#the-with-statement", tags:["上下文","with","资源"]},
{n:"yield", d:"生成器：函数可暂停、逐个产出", syn:"def gen():\n    yield 值\n    yield from 另一个可迭代",
ex:[{t:"生成器是惰性的，省内存", c:`def countdown(n):
    print("start")
    while n > 0:
        yield n
        n -= 1

g = countdown(3)     # 不执行任何代码！
print(next(g))       # start / 3
print(next(g))       # 2
print(list(g))       # [1]（接着上次的位置继续）`},
{t:"yield from 委托给子生成器", c:`def chain_all(a, b):
    yield from a
    yield from b

print(list(chain_all([1, 2], [3, 4])))   # [1, 2, 3, 4]`}],
note:"生成器只能消费一遍，遍历完就空了。处理大文件/大列表用生成器表达式 (x*x for x in range(10**8)) 不会爆内存。",
doc:"https://docs.python.org/zh-cn/3/reference/expressions.html#yieldexpr", tags:["生成器","generator","yield"]},
{n:"async / await", d:"协程语法（3.5+）", syn:"async def 函数():\n    await 另一个协程()",
ex:[{t:"最小可运行示例", c:`import asyncio

async def fetch(name, sec):
    await asyncio.sleep(sec)          # 模拟 IO 等待
    return f"{name} 完成"

async def main():
    # 串行：约 3 秒
    print(await fetch("A", 1))
    print(await fetch("B", 2))
    # 并发：约 2 秒（取最长的）
    print(await asyncio.gather(fetch("C", 1), fetch("D", 2)))

asyncio.run(main())`}],
note:"async 函数调用得到的是协程对象，必须 await 或交给事件循环跑。在 async 函数里用了 time.sleep() 会卡住整个循环，要 await asyncio.sleep()。并发编排看 asyncio 条目。",
doc:"https://docs.python.org/zh-cn/3/reference/coroutines.html", tags:["协程","异步","asyncio","并发"]},
{n:"return", d:"返回值", syn:"return 表达式\nreturn a, b          # 多值=元组\nreturn               # 等价 return None",
ex:[{t:"提前返回（卫语句）让代码更平", c:`def check(user):
    if not user:
        return "未登录"
    if user.get("banned"):
        return "被封禁"
    return "正常"`}],
note:"函数没有 return 时隐式返回 None。try/finally 里 finally 的 return 会覆盖 try 的返回值（别这么写）。",
doc:"https://docs.python.org/zh-cn/3/reference/simple_stmts.html#the-return-statement", tags:["返回"]},
{n:"break / continue", d:"跳出循环 / 跳过本轮", syn:"break      # 结束整个循环\ncontinue   # 结束本轮，进入下一轮",
ex:[{t:"", c:`for i in range(10):
    if i == 3:
        continue      # 跳过 3
    if i == 6:
        break         # 到 6 停止
    print(i, end=" ")
# 0 1 2 4 5`}],
note:"只影响最内层循环。嵌套循环想一次全跳出，用标志位、函数 return、或异常。",
doc:"https://docs.python.org/zh-cn/3/reference/simple_stmts.html#the-break-statement", tags:["循环","break","continue"]},
{n:"pass", d:"占位空语句", syn:"pass",
ex:[{t:"先搭骨架后填肉", c:`class PaymentGateway:
    def pay(self, order):
        pass          # TODO: 接入支付渠道

    def refund(self, order):
        pass`}],
note:"语法上必须有语句但暂时没内容时用（类/函数/分支体不能为空）。",
doc:"https://docs.python.org/zh-cn/3/reference/simple_stmts.html#the-pass-statement", tags:["占位"]},
{n:"None / True / False", d:"三个字面常量", syn:"x = None\nok = True",
ex:[{t:"判空标准写法", c:`x = None
if x is None:        # 判 None 用 is，不用 ==
    print("空")

# falsy 家族：0  0.0  ''  []  {}  set()  None  False
if not items:        # 列表为空的惯用法
    print("没有元素")`}],
note:"bool 是 int 的子类：True + True == 2。is 比较身份（内存地址），== 比较值。小整数缓存只是 CPython 优化，别依赖。",
doc:"https://docs.python.org/zh-cn/3/library/stdtypes.html#truth-value-testing", tags:["空","布尔","真值"]},
{n:"and / or / not", d:"逻辑运算（注意返回的是操作数本身）", syn:"a and b     # a 假返回 a，否则返回 b\na or b      # a 真返回 a，否则返回 b\nnot a",
ex:[{t:"or 的惯用法：给默认值", c:`name = user_input or "匿名"     # 输入为空字符串时取默认

config = {"debug": False}
debug = config.get("debug") or False`},
{t:"and 做安全链式取值", c:`# 前面为假就短路，不会执行后面
city = user and user.address and user.address.city`}],
note:"返回的不是布尔值而是操作数！bool(x and y) 才是布尔。逻辑：and 找假、or 找真（都短路）。",
doc:"https://docs.python.org/zh-cn/3/library/stdtypes.html#boolean-operations", tags:["逻辑","与或非","短路"]},
{n:"in / not in", d:"成员判断", syn:"x in 容器",
ex:[{t:"不同容器的成员判断", c:`3 in [1, 2, 3]        # True（列表：逐个比较，慢）
"a" in "data"          # True（子串判断）
"key" in {"k": 1}      # False（dict 判断的是 key，O(1)）
1 in range(10)         # True（range 按数学判断，不遍历）`}],
note:"频繁成员判断用 set/dict（哈希 O(1)），别用 list（O(n)）。",
doc:"https://docs.python.org/zh-cn/3/reference/expressions.html#membership-test-operations", tags:["包含","成员"]},
{n:"is / is not", d:"同一性判断（同一个对象？）", syn:"a is b     # id(a) == id(b)",
ex:[{t:"is 与 == 的区别", c:`a = [1, 2]
b = [1, 2]
a == b     # True（值相等）
a is b     # False（两个不同对象）

x = None
x is None  # True ← 判 None 唯一正确姿势`}],

/* ===================== 应用逻辑（一般不用改） ===================== */
const CATS = [
  { id:"keyword", label:"关键字 keyword" },
  { id:"builtin", label:"内置函数 builtins" },
  { id:"module",  label:"标准库 stdlib" },
  { id:"syntax",  label:"语法糖 syntax" },
];
const ALL = [];
CATS.forEach(c => (DATA[c.id]||[]).forEach(e => { e.cat = c.id; ALL.push(e); }));
const $ = s => document.querySelector(s);
const listView = $("#list-view"), detailView = $("#detail-view"), input = $("#q");

function esc(t){ return t; } // 代码一律走 textContent，无需转义

function score(e, q){
  const n = e.n.toLowerCase();
  if(n === q) return 200;
  if(n.startsWith(q)) return 100;
  if(n.includes(q)) return 60;
  if((e.tags||[]).some(t => t.toLowerCase().includes(q))) return 40;
  if((e.d||"").toLowerCase().includes(q)) return 20;
  return 0;
}

let results = [], selIdx = -1;

function search(){
  const q = input.value.trim().toLowerCase();
  if(!q){ results = ALL.slice(); } else {
    results = ALL.map(e => [score(e, q), e]).filter(x => x[0] > 0)
      .sort((a, b) => b[0] - a[0]).map(x => x[1]);
  }
  selIdx = -1;
  renderList(q);
}

function renderList(q){
  detailView.hidden = true; listView.hidden = false;
  let html = "";
  if(results.length === 0){
    html = `<div class="empty">没找到「${input.value}」…<br><br>试试英文原名，或去 <a style="color:var(--accent)" href="https://docs.python.org/zh-cn/3/search.html?q=${encodeURIComponent(input.value)}" target="_blank">官方文档搜索 →</a></div>`;
  } else {
    CATS.forEach(c => {
      const items = results.filter(e => e.cat === c.id);
      if(!items.length) return;
      html += `<div class="cat-head"><h2>${c.label}</h2><span class="cnt">${items.length}</span></div>`;
      items.forEach((e, i) => {
        const gi = results.indexOf(e);
        html += `<div class="row${gi===selIdx?" sel":""}" data-i="${gi}">
          <span class="nm">${e.n}</span>
          ${e.v ? `<span class="vbadge">${e.v}</span>` : ""}
          <span class="ds">${e.d||""}</span>
          <span class="badge ${e.cat}" style="margin-left:auto">${catLabel(e.cat)}</span></div>`;
      });
    });
  }
  listView.innerHTML = html;
  listView.querySelectorAll(".row").forEach(r => {
    r.onclick = () => open(+r.dataset.i);
  });
  $("#stats").textContent = q === undefined || !input.value.trim()
    ? `共 ${ALL.length} 条 · 关键字 ${DATA.keyword.length} · 内置函数 ${DATA.builtin.length} · 标准库 ${DATA.module.length} · 语法糖 ${DATA.syntax.length} · ↑↓ 选择，回车打开，Esc 返回`
    : `找到 ${results.length} 条` + (selIdx>=0 ? `（第 ${selIdx+1} 条高亮）` : "");
}

function catLabel(c){ return {keyword:"关键字",builtin:"内置",module:"标准库",syntax:"语法"}[c]; }

function cblock(title, code, withCopy=true){
  return `<div class="cblock">${title?`<div class="ct">${title}</div>`:""}<pre><code></code></pre>${withCopy?'<button class="cbtn">复制</button>':""}</div>`;
}

function open(i){
  const e = results[i] || ALL.find(x => x.n === decodeURIComponent(location.hash.slice(1)));
  if(!e) return;
  history.replaceState(null, "", "#" + encodeURIComponent(e.n));
  let h = `<span class="back" id="back">← 返回列表（Esc）</span>
    <div class="d-title"><h1>${e.n}</h1><span class="badge ${e.cat}">${catLabel(e.cat)}</span>${e.v?`<span class="vbadge">${e.v}</span>`:""}</div>
    <div class="d-desc">${e.d||""}</div>`;
  if(e.syn){
    h += `<div class="sect"><h3>语法</h3>` + cblock("", e.syn, false) + `</div>`;
  }
  if(e.apis && e.apis.length){
    h += `<div class="sect"><h3>API 速查</h3><table class="apis"><tr><th>用法</th><th>说明</th></tr>`;
    e.apis.forEach(a => h += `<tr><td></td><td>${a[1]}</td></tr>`);
    h += `</table></div>`;
  }
  if(e.ex && e.ex.length){
    h += `<div class="sect"><h3>示例</h3>`;
    e.ex.forEach(x => h += cblock(x.t, x.c));
    h += `</div>`;
  }
  if(e.note){
    h += `<div class="sect"><h3>注意</h3><div class="note">${e.note}</div></div>`;
  }
  if(e.doc){
    h += `<a class="doclink" href="${e.doc}" target="_blank">官方文档 →</a>`;
  }
  detailView.innerHTML = h;
  listView.hidden = true; detailView.hidden = false;
  // 填充代码与表格（textContent 防注入）
  const blocks = detailView.querySelectorAll(".cblock");
  const codes = [];
  if(e.syn) codes.push(e.syn);
  (e.ex||[]).forEach(x => codes.push(x.c));
  let ci = 0;
  blocks.forEach(b => {
    const codeEl = b.querySelector("code");
    codeEl.textContent = codes[ci] !== undefined ? codes[ci] : "";
    const btn = b.querySelector(".cbtn");
    if(btn) btn.onclick = () => copyText(codeEl.textContent, btn);
    ci++;
  });
  const apiRows = detailView.querySelectorAll("table.apis tr:has(td)");
  const apiCells = detailView.querySelectorAll("table.apis td:first-child");
  (e.apis||[]).forEach((a, idx) => { if(apiCells[idx]) apiCells[idx].textContent = a[0]; });
  $("#back").onclick = goBack;
  window.scrollTo(0, 0);
}

function goBack(){
  history.replaceState(null, "", location.pathname);
  detailView.hidden = true; listView.hidden = false;
}

async function copyText(t, btn){
  try{ await navigator.clipboard.writeText(t); }
  catch(err){
    const ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  btn.textContent = "已复制 ✓";
  setTimeout(() => btn.textContent = "复制", 1200);
}

/* 键盘与交互 */
input.addEventListener("input", search);
input.addEventListener("keydown", e => {
  if(e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    if(!results.length) return;
    selIdx = e.key === "ArrowDown" ? Math.min(selIdx + 1, results.length - 1)
                                   : Math.max(selIdx - 1, 0);
    renderList();
    const el = listView.querySelector(".row.sel");
    if(el) el.scrollIntoView({ block:"nearest" });
  } else if(e.key === "Enter"){
    if(results.length) open(selIdx >= 0 ? selIdx : 0);
  } else if(e.key === "Escape"){
    if(input.value){ input.value = ""; search(); }
    else if(!detailView.hidden) goBack();
  }
});
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement !== input){
    e.preventDefault(); input.focus();
  } else if(e.key === "Escape" && !detailView.hidden && document.activeElement !== input){
    goBack();
  }
});

/* 快捷 chips */
const CHIP_NAMES = ["operator","itertools","functools","collections","yield","f-string","推导式","re","dataclasses","asyncio","sorted","open"];
$("#chips").innerHTML = CHIP_NAMES.map(n => `<span class="chip">${n}</span>`).join("");
document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
  input.value = c.textContent; search(); input.focus();
});

/* 初始：支持 #名字 直达（如 index.html#operator） */
search();
if(location.hash.length > 1){
  const name = decodeURIComponent(location.hash.slice(1));
  const e = ALL.find(x => x.n.toLowerCase() === name.toLowerCase());
  if(e){ results = ALL; selIdx = ALL.indexOf(e); open(ALL.indexOf(e)); }
}
</script>
